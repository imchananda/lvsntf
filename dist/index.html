<!doctype html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Ephesis&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#122D55" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>NamtanFilm × Levi's 👖✨</title>

  <style>
    /* Instant splash screen — shown before JS loads */
    #app-splash {
      position: fixed;
      inset: 0;
      background: #F8F9FC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }
    #app-splash.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #app-splash img {
      width: 200px;
      height: 250px;
      -o-object-fit: contain;
         object-fit: contain;
      animation: splash-bounce 3s ease-in-out infinite;
    }
    #app-splash .brand {
      margin-top: 20px;
      font-family: 'Archivo Black', sans-serif;
      font-size: 22px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    #app-splash .brand span.red { color: #C21734; }
    #app-splash .brand span.navy { color: #011949; }
    #app-splash .dots {
      margin-top: 16px;
      display: flex;
      gap: 6px;
    }
    #app-splash .dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #C21734;
      animation: splash-dot 1.2s ease-in-out infinite;
    }
    #app-splash .dots span:nth-child(2) { animation-delay: 0.2s; background: #011949; }
    #app-splash .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes splash-bounce {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes splash-dot {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-BV28qHnH.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-D86lDMqW.css">
</head>

<body>
  <!-- Instant splash shown before React loads -->
  <div id="app-splash">
    <img src="./ntf_header.png" alt="NamtanFilm" />
    <div class="brand">
      <span class="red">LEVI'S ×</span> <span class="navy">namtanfilm</span>
    </div>
    <div class="dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <div id="root"></div>
  <script>
    // Hide splash once React mounts
    document.addEventListener('DOMContentLoaded', function() {
      var root = document.getElementById('root');
      var splash = document.getElementById('app-splash');
      var observer = new MutationObserver(function() {
        if (root && root.children.length > 0) {
          splash.classList.add('hidden');
          setTimeout(function() { splash.remove(); }, 600);
          observer.disconnect();
        }
      });
      observer.observe(root, { childList: true, subtree: true });
      // Fallback: hide after 8s regardless
      setTimeout(function() {
        if (splash && splash.parentNode) {
          splash.classList.add('hidden');
          setTimeout(function() { if (splash.parentNode) splash.remove(); }, 600);
        }
      }, 8000);
    });
  </script>
</body>

</html>
